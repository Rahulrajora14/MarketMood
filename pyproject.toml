[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmood"
version = "0.1.0"
description = "Sentiment-augmented prediction of US equity movement under varying policy-uncertainty regimes"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "pyyaml>=6",
  "scikit-learn>=1.4", "lightgbm>=4.1", "statsmodels>=0.14", "arch>=6.2", "scipy>=1.11",
  "exchange_calendars>=4.5", "yfinance>=0.2.40", "requests>=2.31",
  "matplotlib>=3.8", "tabulate>=0.9", "joblib>=1.3",
]

[project.optional-dependencies]
nlp = ["torch>=2.1", "transformers>=4.40"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33", "altair>=5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["marketmood*"]

[tool.setuptools.package-data]
marketmood = ["resources/*.csv"]
